[project]
name = "election-research"
version = "0.1.0"
description = "Reference analytics for the proper election app"
requires-python = ">=3.11"

[project.optional-dependencies]
crawler = [
  "lxml>=5.3,<7",
  "requests[socks]>=2.32,<3",
]
dev = [
  "ruff>=0.6,<1",
]

[project.scripts]
election-research = "election_research.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
