[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "elections-workbench-backend"
version = "0.1.0"
description = "Reproducible ingestion and exploration backend for Russian election data"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "fonttools>=4.55,<5",
  "lxml>=5.3,<7",
  "py7zr>=0.22,<1",
  "PyMySQL>=1.1,<2",
  "SQLAlchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
elections-data = "elections.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["elections"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
